name: app-ci
# 可复用构建模板：任何仓库一行 uses 即可获得与平台一致的
# build → trivy 扫描 → cosign 签名 → 自动改 k8s-platform 的 newTag
#
# 两种执行模式：
#   ubuntu-latest（默认）：构建在境外 runner，推 GHCR（事实源）+ 可选双推 TCR
#   self-hosted：构建在国内 runner，跳过 GHCR，只推 TCR；缓存走 TCR registry cache
#
# 用法（在应用源码仓 .github/workflows/ci.yml 里）：
#   jobs:
#     deploy:
#       uses: byte-marvel/ci-templates/.github/workflows/app-ci.yml@main
#       with:
#         app: <应用名>            # = k8s-platform 的 apps/<app> 目录名 = GHCR 包名
#       secrets:
#         DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}   # 跨仓改 newTag 的令牌
on:
  workflow_call:
    inputs:
      app:
        description: 应用名（k8s-platform apps/<app> 目录名）
        required: true
        type: string
      image:
        description: 完整镜像名（不含 tag）；缺省 ghcr.io/byte-marvel/<app>
        required: false
        type: string
      context:
        description: Docker 构建上下文（应用仓内路径），缺省仓库根
        required: false
        type: string
        default: '.'
      dockerfile:
        description: Dockerfile 路径（相对构建上下文）
        required: false
        type: string
        default: 'Dockerfile'
      tcr_namespace:
        description: TCR 个人版命名空间；配合 secrets TCR_USER/TCR_PASSWORD 启用 TCR 推送
        required: false
        type: string
        default: ''
      runs_on:
        description: 执行 runner（ubuntu-latest=境外默认 / self-hosted=国内节点）
        required: false
        type: string
        default: 'ubuntu-latest'
      push_ghcr:
        description: 是否推 GHCR（self-hosted 模式跨境推 GHCR 极慢，应设 false）
        required: false
        type: boolean
        default: true
      buildx_builder:
        description: self-hosted 模式使用的持久 buildx builder 名（含 mirror 配置）；缺省自动创建
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_TOKEN:
        description: fine-grained PAT（只授权 k8s-platform 仓 contents:write）。同仓调用可不传。
        required: false
      TCR_USER:
        description: 腾讯云 TCR 个人版访问凭证用户名（集群从国内拉镜像）。不传则只推 GHCR。
        required: false
      TCR_PASSWORD:
        description: 腾讯云 TCR 个人版访问凭证密码。
        required: false

permissions:
  contents: write   # 提交 newTag（同仓模式）
  packages: write   # 推 GHCR
  id-token: write   # cosign keyless 签名

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    env:
      APP: ${{ inputs.app }}
      IMAGE: ${{ inputs.image || format('ghcr.io/byte-marvel/{0}', inputs.app) }}
      # secrets 不能直接用于 step 的 if，经 env 中转判断
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      # trivy/cosign 对准实际推送的 registry：推了 TCR 就用 TCR，否则 GHCR
      SCAN_IMAGE: ${{ (inputs.tcr_namespace != '' && secrets.TCR_PASSWORD != '') && format('ccr.ccs.tencentyun.com/{0}/{1}', inputs.tcr_namespace, inputs.app) || format('ghcr.io/byte-marvel/{0}', inputs.app) }}
      # self-hosted 缓存走 TCR registry cache（gha cache 从国内上传跨境极慢）；否则 gha
      CACHE_REF: ${{ format('type=registry,ref=ccr.ccs.tencentyun.com/{0}/{1}:buildcache', inputs.tcr_namespace, inputs.app) }}
      CACHE_FROM: ${{ inputs.runs_on == 'self-hosted' && format('type=registry,ref=ccr.ccs.tencentyun.com/{0}/{1}:buildcache', inputs.tcr_namespace, inputs.app) || 'type=gha' }}
      CACHE_TO: ${{ inputs.runs_on == 'self-hosted' && format('type=registry,ref=ccr.ccs.tencentyun.com/{0}/{1}:buildcache,mode=max', inputs.tcr_namespace, inputs.app) || 'type=gha,mode=max' }}
    steps:
      - uses: actions/checkout@v4

      - name: 模式检查（self-hosted 必须 TCR 就绪）
        if: inputs.runs_on == 'self-hosted' && (env.TCR_PASSWORD == '' || inputs.tcr_namespace == '')
        run: |
          echo "::error::self-hosted 模式必须提供 tcr_namespace 与 secrets TCR_USER/TCR_PASSWORD（只推 TCR，无 GHCR 兜底）"
          exit 1

      - name: 计算镜像 tag（短 sha）
        id: ver
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 生成 buildkit mirror 配置（self-hosted 构建层拉取走国内 mirror）
        if: inputs.runs_on == 'self-hosted'
        run: |
          cat > buildkitd.toml <<'EOF'
          [registry."docker.io"]
            mirrors = ["mirror.ccs.tencentyun.com"]
          [registry."ghcr.io"]
            mirrors = ["ghcr.1ms.run"]
          EOF

      - name: 准备 buildx（self-hosted 传入 config，确保重建时也带 mirror）
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ inputs.buildx_builder }}
          buildkitd-config: ${{ inputs.runs_on == 'self-hosted' && 'buildkitd.toml' || '' }}

      - name: 登录 GHCR
        if: inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 TCR（国内分发；TCR_PASSWORD 未配置时跳过）
        if: env.TCR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USER }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: 构建并推送 GHCR（事实源档案）
        if: inputs.push_ghcr
        id: push
        uses: docker/build-push-action@v6
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          load: true   # 镜像留在 runner 本地，trivy 直接扫本地，无需 registry 凭据
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}

      - name: 构建并推送 TCR（集群国内拉取）
        if: env.TCR_PASSWORD != ''
        id: push_tcr
        uses: docker/build-push-action@v6
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          load: true   # trivy 扫描本地
          tags: |
            ccr.ccs.tencentyun.com/${{ inputs.tcr_namespace }}/${{ inputs.app }}:${{ steps.ver.outputs.tag }}
            ccr.ccs.tencentyun.com/${{ inputs.tcr_namespace }}/${{ inputs.app }}:latest
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}

      - name: Trivy 扫描（CRITICAL 阻断，只报有修复版本的；扫 runner 本地镜像）
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          # self-hosted 国内节点：默认的 mirror.gcr.io 跨境超时，改走腾讯内网 docker hub mirror
          DB_REPO: ${{ inputs.runs_on == 'self-hosted' && 'mirror.ccs.tencentyun.com/aquasec/trivy-db:2' || 'mirror.gcr.io/aquasec/trivy-db:2' }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.75.0 image \
            --db-repository "$DB_REPO" \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$SCAN_IMAGE:$TAG"

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3

      - name: cosign keyless 签名
        run: |
          if [ "${{ inputs.push_ghcr }}" = "true" ]; then
            cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          else
            cosign sign --yes "${SCAN_IMAGE}@${{ steps.push_tcr.outputs.digest }}"
          fi

      - name: 改 k8s-platform 的 newTag 并推送
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            # 跨仓模式：克隆 k8s-platform 用 DEPLOY_TOKEN 提交
            git clone -q --depth 1 \
              "https://x-access-token:${DEPLOY_TOKEN}@github.com/byte-marvel/k8s-platform.git" deploy-repo
            cd deploy-repo
          fi
          # git identity 必须设在最终提交的仓里（跨仓模式下 cd 进了 deploy-repo）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "/^\s*-\s*name:\s*${APP}\s*$/,/newTag:/ s#(newTag:).*#\1 ${TAG}#" apps/${APP}/kustomization.yaml
          grep -q "newTag: ${TAG}$" apps/${APP}/kustomization.yaml \
            || { echo "k8s-platform 里没找到 apps/${APP} 的 name: ${APP} images 项，先建清单目录"; exit 1; }
          if git diff --quiet; then
            echo "tag 已是目标值，跳过"
          else
            git commit -am "deploy: ${APP} -> ${TAG} (run ${{ github.run_id }}) [skip ci]"
            git push
          fi
